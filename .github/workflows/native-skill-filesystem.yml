name: Native skill filesystem

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/native-skill-filesystem.yml
      - scripts/ci/codex-shared-skill-discovery.mjs
      - pnpm-lock.yaml
      - packages/proprio-runner/package.json
      - packages/proprio-runner/src/drivers/codex/app-server-transport.ts
      - packages/proprio-runner/src/drivers/codex/codex-security-config.ts
      - server/src/services/skill-repository-package.ts
      - packages/proprio-runner/src/drivers/runtime-context-materializer.ts
      - packages/proprio-runner/src/drivers/runtime-context-materializer.test.ts
      - packages/proprio-runner/src/live/runnerd-restart-continuation.test.ts
      - packages/proprio-runner/src/live/runner-provider-launch.ts
      - packages/proprio-runner/src/live/runnerd-codex-transport.ts
      - server/src/services/native-runtime/local-codex-repository-cache.ts
      - server/src/services/native-runtime/local-codex-repository-cache.test.ts
      - packages/proprio-runner/runner/crates/runner-core/src/bin/fake-codex-app-server.rs

permissions:
  contents: read

jobs:
  skill-staging:
    if: github.repository == 'groktopus/proprio' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          npm install --global --ignore-scripts pnpm@9.15.4
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the stock Linux sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs bubblewrap apparmor-profiles
          # Load the distro profile for the specific packaged binary. Leave the
          # runner's system-wide restrictions and the app's filesystem policy on.
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test "$(readlink -f "$(command -v bwrap)")" = /usr/bin/bwrap
          timeout 10s /usr/bin/bwrap --unshare-user --ro-bind / / --cap-drop ALL /bin/true
      - name: Verify controller repository cache scope, cleanup, and archive
        run: pnpm --filter @groktopus/server exec vitest run src/services/native-runtime/local-codex-repository-cache.test.ts
      - name: Build the native runner and synthetic Codex provider
        run: |
          pnpm --filter @groktopus/proprio-runner build:typescript
          cargo build --manifest-path packages/proprio-runner/runner/Cargo.toml --locked \
            -p proprio-runner-core --bin proprio-runnerd --bin fake-codex-app-server
      - name: Verify ext4 copies and Btrfs shared extents
        run: |
          scratch="$(mktemp -d /tmp/pfs.XXXXXX)"
          mkdir "$scratch/mount"
          discovery_mount="$(mktemp -d "$RUNNER_TEMP/proprio-codex.XXXXXX")"
          cleanup() {
            if mountpoint -q "$discovery_mount"; then sudo umount "$discovery_mount"; fi
            if mountpoint -q "$scratch/mount"; then sudo umount "$scratch/mount"; fi
          }
          trap cleanup EXIT
          for filesystem in ext4 btrfs; do
            image="$scratch/$filesystem.image"
            truncate -s 256M "$image"
            if [ "$filesystem" = ext4 ]; then
              mkfs.ext4 -F "$image"
            else
              mkfs.btrfs "$image"
            fi
            sudo mount -o loop "$image" "$scratch/mount"
            sudo chown "$(id -u):$(id -g)" "$scratch/mount"
            TMPDIR="$scratch/mount" PROPRIO_TEST_CODEX_SKILL_FILESYSTEM="$filesystem" \
              pnpm --filter @groktopus/proprio-runner exec vitest run --maxWorkers 1 \
              src/drivers/runtime-context-materializer.test.ts -t 'measures pinned repository skill staging|shares an ext4 repository|recreates a pinned repository'
            if [ "$filesystem" = ext4 ]; then
              # Codex deliberately denies /tmp within its command sandbox.
              # Give the real provider a second view of the same ext4 fixture
              # outside /tmp. Keep the short path for runner control sockets.
              sudo mount --bind "$scratch/mount" "$discovery_mount"
              for shared_inodes in 0 1; do
                sudo unshare --net -- runuser -u "$(id -un)" -- \
                  env TMPDIR="$discovery_mount" PATH="$PATH" PROPRIO_TEST_ISOLATED_NETWORK=1 \
                  PROPRIO_TEST_CODEX_SHARED_INODES="$shared_inodes" "$(command -v node)" \
                  --import ./cli/node_modules/tsx/dist/loader.mjs scripts/ci/codex-shared-skill-discovery.mjs
              done
              sudo umount "$discovery_mount"
              TMPDIR="$scratch/mount" PROPRIO_TEST_NATIVE_SKILL_EXT4=1 \
                pnpm --filter @groktopus/proprio-runner exec vitest run --maxWorkers 1 \
                src/live/runnerd-restart-continuation.test.ts -t 'completes after the real runner and provider are killed'
            fi
            sudo umount "$scratch/mount"
          done
