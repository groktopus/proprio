name: Native skill filesystem

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/native-skill-filesystem.yml
      - scripts/ci/codex-shared-skill-discovery.mjs
      - packages/proprio-runner/src/drivers/runtime-context-materializer.ts
      - packages/proprio-runner/src/drivers/runtime-context-materializer.test.ts
      - packages/proprio-runner/src/live/runnerd-restart-continuation.test.ts
      - packages/proprio-runner/runner/crates/runner-core/src/bin/fake-codex-app-server.rs

permissions:
  contents: read

jobs:
  skill-staging:
    if: github.repository == 'groktopus/proprio' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          npm install --global --ignore-scripts pnpm@9.15.4
          pnpm install --frozen-lockfile --ignore-scripts
          if ! command -v mkfs.btrfs; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends btrfs-progs
          fi
      - name: Build the native runner and synthetic Codex provider
        run: |
          pnpm --filter @groktopus/proprio-runner build:typescript
          cargo build --manifest-path packages/proprio-runner/runner/Cargo.toml --locked \
            -p proprio-runner-core --bin proprio-runnerd --bin fake-codex-app-server
      - name: Verify ext4 copies and Btrfs shared extents
        run: |
          scratch="$(mktemp -d /tmp/pfs.XXXXXX)"
          mkdir "$scratch/mount"
          trap 'if mountpoint -q "$scratch/mount"; then sudo umount "$scratch/mount"; fi' EXIT
          for filesystem in ext4 btrfs; do
            image="$scratch/$filesystem.image"
            truncate -s 256M "$image"
            if [ "$filesystem" = ext4 ]; then
              mkfs.ext4 -F "$image"
            else
              mkfs.btrfs "$image"
            fi
            sudo mount -o loop "$image" "$scratch/mount"
            sudo chown "$(id -u):$(id -g)" "$scratch/mount"
            TMPDIR="$scratch/mount" PROPRIO_TEST_CODEX_SKILL_FILESYSTEM="$filesystem" \
              pnpm --filter @groktopus/proprio-runner exec vitest run --maxWorkers 1 \
              src/drivers/runtime-context-materializer.test.ts -t 'measures pinned repository skill staging'
            if [ "$filesystem" = ext4 ]; then
              sudo unshare --net -- runuser -u "$(id -un)" -- \
                env TMPDIR="$scratch/mount" PATH="$PATH" "$(command -v node)" \
                scripts/ci/codex-shared-skill-discovery.mjs packages/proprio-runner/node_modules/.bin/codex
              TMPDIR="$scratch/mount" PROPRIO_TEST_NATIVE_SKILL_EXT4=1 \
                pnpm --filter @groktopus/proprio-runner exec vitest run --maxWorkers 1 \
                src/live/runnerd-restart-continuation.test.ts -t 'completes after the real runner and provider are killed'
            fi
            sudo umount "$scratch/mount"
          done
