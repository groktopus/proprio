name: Trusted pull request policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  lockfile-policy:
    name: Lockfile trust policy
    if: github.repository == 'groktopus/proprio'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the trusted base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          # The job fetches the PR head as data only. It never executes PR code.
          persist-credentials: true

      - name: Block untrusted lockfile edits
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PROPRIO_CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          LOCKFILE_REFRESH_APP_LOGIN: ${{ vars.LOCKFILE_REFRESH_APP_LOGIN }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REF: refs/pull/${{ github.event.pull_request.number }}/head
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_HEAD_REF" == "refs/pull/$PR_NUMBER/head" ]]
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

          policy="$RUNNER_TEMP/lockfile-trust.mjs"
          if ! git cat-file -e "$BASE_SHA:.github/scripts/lockfile-trust.mjs" 2>/dev/null; then
            echo "::error::Trusted base $BASE_SHA is missing lockfile-trust.mjs."
            exit 1
          fi
          git show "$BASE_SHA:.github/scripts/lockfile-trust.mjs" > "$policy"
          test -s "$policy"

          # Fetch the exact event head as Git data only. Reject ref movement during the run.
          git fetch --no-tags origin "$PR_HEAD_REF"
          fetched_head="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if ! test "$fetched_head" = "$HEAD_SHA"; then
            echo "::error::Fetched PR head $fetched_head differs from event head $HEAD_SHA. Rerun this check on the latest PR revision."
            exit 1
          fi
          BASE_SHA="$BASE_SHA" node "$policy" pr
          if ! grep -q '^writer=' "$GITHUB_OUTPUT"; then
            echo "::error::Trusted lockfile policy did not report a lockfile writer."
            exit 1
          fi

  lockfile-policy-status:
    name: Publish lockfile policy status
    if: always() && github.repository == 'groktopus/proprio'
    needs: [lockfile-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - name: Report verdict on the exact pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          POLICY_RESULT: ${{ needs.lockfile-policy.result }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          state=failure
          description='Trusted lockfile policy failed; inspect the workflow run.'
          if [[ "$POLICY_RESULT" == success ]]; then
            state=success
            description='Trusted lockfile policy passed for this exact pull request head.'
          fi
          body="$RUNNER_TEMP/lockfile-policy-status.json"
          jq -n --arg state "$state" --arg description "$description" \
            --arg context 'proprio/lockfile-trust' --arg target_url "$RUN_URL" \
            '{state:$state,description:$description,context:$context,target_url:$target_url}' > "$body"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data-binary "@$body" \
            "$API_URL/repos/$REPOSITORY/statuses/$HEAD_SHA" >/dev/null
