name: Attention queue browser journeys

on:
  pull_request:
    paths:
      - "ui/src/components/Sidebar.tsx"
      - "ui/src/components/Sidebar.production.tsx"
      - "ui/src/components/CoordinatorSidebar.tsx"
      - "ui/src/components/AttentionTasksHint.tsx"
      - "ui/src/components/MobileBottomNav.tsx"
      - "ui/src/components/**/CoordinatorNeedsYou.tsx"
      - "ui/src/pages/WhatNeedsMe.tsx"
      - "ui/src/pages/DecisionQueuePage.tsx"
      - "ui/src/storybook/stories/inbox-search/decisions-desk.stories.tsx"
      - "ui/storybook/**"
      - "tests/storybook-visual/attention-queue-navigation.*"
      - ".github/workflows/attention-queue-browser.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build-storybook
      - run: pnpm exec playwright test --config tests/storybook-visual/attention-queue-navigation.config.ts
