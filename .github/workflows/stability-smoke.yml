name: Stability smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: stability-smoke-${{ github.event.pull_request.number }}
  # A title or body edit can queue smoke but should not interrupt a running check.
  cancel-in-progress: ${{ github.event.action != 'edited' || github.event.changes.base != null }}

jobs:
  smoke:
    # Fork heads run with a read-only token on a GitHub-hosted runner.
    if: github.repository == 'groktopus/proprio'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify head and install locked dependencies
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          npm install --global --ignore-scripts pnpm@9.15.4
          pnpm install --frozen-lockfile --ignore-scripts
          # Restore only the embedded Postgres package symlinks for test fixtures.
          postgres_package=(node_modules/.pnpm/@embedded-postgres+linux-x64@*/node_modules/@embedded-postgres/linux-x64)
          test "${#postgres_package[@]}" = 1
          (cd "${postgres_package[0]}" && node scripts/hydrate-symlinks.js)
          pnpm --filter @groktopus/plugin-sdk ensure-build-deps
      - name: Check authorization, audit access, and credential lifecycle
        run: node scripts/ci/run-security-regressions.mjs
      - name: Check competing approval revision requests
        run: |
          test_file=server/src/__tests__/approval-queue-seeding-work.test.ts
          pnpm exec vitest run --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/approval-results.json" "$test_file" -t 'first revision request|waits for resubmission'
          node --input-type=module - "$test_file" <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { assertRequiredVitestTests } from './scripts/ci/assert-required-vitest-tests.mjs';
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'approval-results.json'), 'utf8'));
          assertRequiredVitestTests(result, { [process.argv[2]]: [
            'keeps the first revision request and rejects a waiting operator',
            'waits for resubmission and never removes retained membership after approval',
          ] });
          JS
      - name: Validate contributor instructions and adapter boundaries
        run: pnpm check:agents && pnpm test:check-agents && pnpm check:no-git-push
      - name: Check the verifier's default branch selection
        run: node --test --test-name-pattern='implicit verification|the remote default' scripts/__tests__/local-verify.test.mjs
      - name: Check goal hierarchy cycle prevention and recovery
        run: |
          goal_test=server/src/__tests__/goal-parent-company-validation.test.ts
          tree_test=ui/src/components/GoalTree.test.tsx
          pnpm exec vitest run --maxWorkers 1 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/goal-cycle-results.json" "$goal_test" "$tree_test"
          node --input-type=module - "$goal_test" "$tree_test" <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { assertRequiredVitestTests } from './scripts/ci/assert-required-vitest-tests.mjs';
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'goal-cycle-results.json'), 'utf8'));
          assertRequiredVitestTests(result, {
            [process.argv[2]]: [
              'rejects self-parenting and moves under immediate or deeper descendants',
              'allows clearing a parent to repair an already-cyclic hierarchy',
              'rejects one of two concurrent edits that would jointly form a cycle',
            ],
            [process.argv[3]]: ['keeps goals in a saved cycle and their descendants visible'],
          });
          JS
      - name: Verify generated API documentation
        run: pnpm docs:api:check
      - name: Check transactional document revision conflicts
        run: |
          test_file=server/src/__tests__/documents-service.test.ts
          pnpm exec vitest run --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/document-results.json" "$test_file"
          node --input-type=module - "$test_file" <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { assertRequiredVitestTests } from './scripts/ci/assert-required-vitest-tests.mjs';
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'document-results.json'), 'utf8'));
          assertRequiredVitestTests(result, { [process.argv[2]]: [
            'reports the winning revision when two saves share the same base',
            'preserves the duplicate-key conflict for overlapping document creation',
            'locks and unlocks issue documents',
          ] });
          JS
      - name: Check service onboarding
        run: pnpm exec vitest run cli/src/__tests__/onboard-service.test.ts
      - name: Check managed restart and same-version updates
        run: |
          pnpm exec vitest run cli/src/__tests__/managed-service-restart.test.ts cli/src/__tests__/service-health-check.test.ts server/src/__tests__/managed-restart-health.test.ts
          report="$RUNNER_TEMP/managed-update-results.json"
          pnpm exec vitest run --reporter=default --reporter=json --outputFile="$report" \
            cli/src/__tests__/update-command.test.ts -t 'validates a same-version Git update|settles overlapping managed Git updates'
          node --input-type=module - "$report" <<'JS'
          import { readFileSync } from 'node:fs';
          import { assertRequiredVitestTests } from './scripts/ci/assert-required-vitest-tests.mjs';
          assertRequiredVitestTests(JSON.parse(readFileSync(process.argv[2], 'utf8')), {
            'cli/src/__tests__/update-command.test.ts': [
              'validates a same-version Git update before retaining its new payload (true)',
              'validates a same-version Git update before retaining its new payload (false)',
              'settles overlapping managed Git updates when older passes',
              'settles overlapping managed Git updates when older fails',
              'settles overlapping managed Git updates when both fail',
              'settles overlapping managed Git updates when staging fails',
            ],
          });
          JS
      - name: Check database backup CLI output
        run: pnpm exec vitest run cli/src/__tests__/db-backup.test.ts
      - name: Check cost summaries and database backups
        run: |
          pnpm exec vitest run --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/stability-results.json" server/src/__tests__/costs-service.test.ts packages/db/src/backup-lib.test.ts packages/db/src/backup-lib-restore.test.ts packages/db/src/backup-lib-binary.test.ts
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'stability-results.json'), 'utf8'));
          const assertions = result.testResults.flatMap(file => file.assertionResults);
          const required = [
            'aggregates run wall-clock duration across the recursive issue tree',
            'reclaims aged orphan output while preserving a concurrent backup',
            'preserves aged staging owned by a different live process and reclaims it after exit',
            'preserves identity generation, sequence options and progress in JavaScript backups',
          ];
          for (const title of required) {
            if (!assertions.some(test => test.title === title && test.status === 'passed')) {
              throw new Error(`Required PostgreSQL test did not pass: ${title}`);
            }
          }
          JS
      - name: Check linked goal deletion
        run: |
          test_file=server/src/__tests__/project-goal-validation.test.ts
          pnpm exec vitest run --maxWorkers 1 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/goal-deletion-results.json" "$test_file"
          node --input-type=module - "$test_file" <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { assertRequiredVitestTests } from './scripts/ci/assert-required-vitest-tests.mjs';
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'goal-deletion-results.json'), 'utf8'));
          assertRequiredVitestTests(result, { [process.argv[2]]: [
            'returns a project conflict when deleting a goal linked as primary',
            'returns a project conflict when deleting a goal linked as secondary',
            'returns a project conflict when deleting a goal linked as legacy',
            'returns an actionable child_goal deletion conflict',
            'returns an actionable task deletion conflict',
            'deletes a standalone goal once and logs the successful mutation',
            'rolls back goal deletion when its activity record cannot be inserted',
          ] });
          JS
      - name: Check Agent Chat supersession and Stop
        run: |
          pnpm exec vitest run --maxWorkers 1 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/chat-supersession-results.json" \
            server/src/__tests__/chat-completion-delivery.test.ts \
            server/src/__tests__/heartbeat-chat-completion-supersession.test.ts \
            server/src/services/heartbeat/run-completion.test.ts \
            ui/src/components/TaskChatThread.test.tsx \
            ui/src/components/task-chat/status-relevance.test.ts \
            ui/src/context/LiveUpdatesProvider.test.ts \
            -t 'Agent Chat supersession through heartbeat|quietly skips a superseded chat completion|durable operator Stop claimed|keeps a real setup failure visible|omits a superseded|ignores a newer .* superseded completion|scheduler-only chat supersession toast|settles terminal recipient deliveries|keeps paused agents paused'
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { assertRequiredVitestTests } from './scripts/ci/assert-required-vitest-tests.mjs';
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'chat-supersession-results.json'), 'utf8'));
          const required = {
            'server/src/__tests__/chat-completion-delivery.test.ts': [
              'settles terminal recipient deliveries without touching completed work or other recipients',
              'keeps paused agents paused and retries after they resume',
            ],
            'server/src/__tests__/heartbeat-chat-completion-supersession.test.ts': [
              'promotes a real user message parked behind the obsolete completion',
              'preserves the settled agent projection for provider_quota',
              'preserves the settled agent projection for setup_failed',
              'preserves provider_quota through completion preflight (stale on claim)',
              'preserves setup_failed through completion preflight (stale on claim)',
              'preserves provider_quota through completion preflight (invalidated after finalizer)',
              'preserves setup_failed through completion preflight (invalidated after finalizer)',
              'counts an admitted completion as a genuine running sibling',
            ],
            'server/src/services/heartbeat/run-completion.test.ts': [
              'quietly skips a superseded chat completion (reset)',
              'quietly skips a superseded chat completion (retargeted)',
              'preserves a durable operator Stop claimed before quiet chat supersession',
              'keeps a real setup failure visible even if its text matches chat supersession',
            ],
            'ui/src/components/TaskChatThread.test.tsx': [
              'omits a superseded native completion without hiding a genuine setup failure',
              'omits a superseded legacy completion without hiding a genuine setup failure',
            ],
            'ui/src/components/task-chat/status-relevance.test.ts': [
              'ignores a newer cancelled superseded completion without hiding a real failure',
              'ignores a newer succeeded superseded completion without hiding a real failure',
            ],
            'ui/src/context/LiveUpdatesProvider.test.ts': [
              'suppresses a succeeded scheduler-only chat supersession toast',
              'suppresses a cancelled scheduler-only chat supersession toast',
            ],
          };
          assertRequiredVitestTests(result, required);
          JS
      - name: Check release registry from source
        run: pnpm test:release-registry
      - name: Check interrupted plugin job recovery
        run: |
          test_file=server/src/__tests__/plugin-scheduled-work.test.ts
          pnpm exec vitest run --maxWorkers 1 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/plugin-recovery-results.json" "$test_file" -t 'reconciles an interrupted|another scheduler|reports shutdown persistence failure'
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { assertRequiredVitestTests } from './scripts/ci/assert-required-vitest-tests.mjs';
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'plugin-recovery-results.json'), 'utf8'));
          assertRequiredVitestTests(result, {
            'server/src/__tests__/plugin-scheduled-work.test.ts': [
              'reconciles an interrupted queued plugin run after startup',
              'reconciles an interrupted running plugin run after startup',
              "keeps another scheduler's live plugin run intact",
              'reports shutdown persistence failure and retains the result for another stop attempt',
            ],
          });
          JS
      - name: Check native replay heartbeat cadence
        run: |
          test_file=server/src/__tests__/native-run-projection-work.test.ts
          pnpm exec vitest run --maxWorkers 1 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/native-heartbeat-results.json" \
            "$test_file" -t 'does not postpone an agent timer|records a genuine heartbeat|one-time stranded agent status repair|waits for delegated run projection|preserves actual operator Stop when accepted|settlement receipt'
          node --input-type=module - "$test_file" <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { assertRequiredVitestTests } from './scripts/ci/assert-required-vitest-tests.mjs';
          const path = process.argv[2];
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'native-heartbeat-results.json'), 'utf8'));
          const required = [
            'does not postpone an agent timer when orphan recovery replays a native run finished 120 minutes ago',
            'does not postpone an agent timer when orphan recovery replays a native run finished 1 minutes ago',
            'records a genuine heartbeat when recovering a new result',
            'records a genuine heartbeat when recovering a failed execution',
            'retains the live settlement receipt when accepted result commit is deferred',
            'records a genuine heartbeat when recovering a delegated projection',
            'records a genuine heartbeat when recovering a delegated first heartbeat',
            'preserves actual operator Stop when accepted succeeded work finishes delayed workspace finalization',
            'preserves actual operator Stop when accepted failed work finishes delayed workspace finalization',
            'records a genuine heartbeat when recovering a provisional failure',
            'records a genuine heartbeat when recovering a claimed wake',
            'records a genuine heartbeat when recovering a unsuccessful workspace barrier',
            'leaves one-time stranded agent status repair to its existing recovery owner',
            'waits for delegated run projection before committed resource settlement',
            'records one settlement receipt across competing callbacks and a clock rollback',
          ];
          assertRequiredVitestTests(result, { [path]: required });
          JS
      - name: Check recovery of unrecorded routine occurrences
        run: |
          test_file=server/src/__tests__/routine-schedule-work.test.ts
          pnpm exec vitest run --maxWorkers 1 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/routine-retry-results.json" "$test_file"
          node --input-type=module - "$test_file" <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { assertRequiredVitestTests } from './scripts/ci/assert-required-vitest-tests.mjs';
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'routine-retry-results.json'), 'utf8'));
          assertRequiredVitestTests(result, { [process.argv[2]]: [
            'retries unrecorded catch-up work after the scheduler restarts with 0 recorded runs',
            'retries unrecorded catch-up work after the scheduler restarts with 1 recorded runs',
          ] });
          JS
      - name: Check cron parsing and schedule recovery
        run: |
          pnpm exec vitest run server/src/services/cron.test.ts
          pnpm exec vitest run --maxWorkers 1 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/cron-schedule-results.json" \
            server/src/__tests__/routine-schedule-work.test.ts server/src/__tests__/plugin-scheduled-work.test.ts -t 'malformed'
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { assertRequiredVitestTests } from './scripts/ci/assert-required-vitest-tests.mjs';
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'cron-schedule-results.json'), 'utf8'));
          assertRequiredVitestTests(result, {
            'server/src/__tests__/routine-schedule-work.test.ts': [
              'rejects malformed cron 15oops * * * * on creation and editing',
              'rejects malformed cron */10minutes * * * * on creation and editing',
              'rejects malformed cron 5-10-12 * * * * on creation and editing',
              'pauses a saved malformed schedule without firing its stale deadline',
            ],
            'server/src/__tests__/plugin-scheduled-work.test.ts': [
              'clears a saved malformed plugin deadline and still allows manual execution',
            ],
          });
          JS
      - name: Check native settlement callback consumers
        run: |
          node --test scripts/ci/assert-required-vitest-tests.test.mjs
          pnpm exec vitest run --maxWorkers 1 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/native-callback-results.json" \
            server/src/services/native-runtime/native-workspace-finalizer.test.ts \
            server/src/__tests__/native-workspace-finalization-work.test.ts \
            server/src/services/heartbeat/agent-status.test.ts
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { assertRequiredVitestTests } from './scripts/ci/assert-required-vitest-tests.mjs';
          assertRequiredVitestTests(JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'native-callback-results.json'), 'utf8')), {
            'server/src/services/heartbeat/agent-status.test.ts': [
              'settles only a transient running flag after overlap with a superseded completion',
            ],
            'server/src/services/native-runtime/native-workspace-finalizer.test.ts': [
              'accounts for a removed workspace plugin without blocking other accepted runs',
            ],
          });
          JS
      - name: Check Inbox and shared polling with denied browser storage
        run: pnpm exec vitest run --maxWorkers 1 ui/src/lib/task-collection-preferences.test.ts ui/src/lib/cross-tab-poll.test.ts ui/src/hooks/useSharedPolling.test.ts ui/src/hooks/useSharedPollingSnapshot.test.tsx ui/src/pages/Inbox.test.tsx
      - name: Check late live settlement metadata
        run: pnpm exec vitest run --maxWorkers 1 server/src/services/heartbeat/run-completion.test.ts -t 'reconciliation wins'
      - name: Check closed budget windows and current holds
        run: |
          test_file=server/src/__tests__/budgets-service.test.ts
          pnpm exec vitest run --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/budget-rollover.json" "$test_file" -t 'retires the closed monthly incident'
          node --input-type=module - "$test_file" <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { assertRequiredVitestTests } from './scripts/ci/assert-required-vitest-tests.mjs';
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'budget-rollover.json'), 'utf8'));
          assertRequiredVitestTests(result, { [process.argv[2]]: [
            'retires the closed monthly incident with 20 cents spent this month',
            'retires the closed monthly incident with 125 cents spent this month',
          ] });
          JS
      - name: Check atomic company import
        run: |
          test_file=server/src/__tests__/company-portability-import-batching.test.ts
          pnpm exec vitest run --maxWorkers 1 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/import-atomicity-results.json" "$test_file" -t 'rolls back a failed new-company'
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { assertRequiredVitestTests } from './scripts/ci/assert-required-vitest-tests.mjs';
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'import-atomicity-results.json'), 'utf8'));
          assertRequiredVitestTests(result, {
            'server/src/__tests__/company-portability-import-batching.test.ts': [
              'rolls back a failed new-company import and retries without duplicating tasks',
            ],
          });
          JS
      - name: Check company portability
        run: pnpm exec vitest run server/src/__tests__/company-portability.test.ts
      - name: Check Team Catalog runtime previews
        run: |
          test_file=server/src/__tests__/teams-catalog-install-no-overrides.test.ts
          pnpm exec vitest run --maxWorkers 1 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/catalog-runtime-results.json" "$test_file" -t 'previews the native Codex|surfaces an unavailable default|honors an explicit caller'
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { assertRequiredVitestTests } from './scripts/ci/assert-required-vitest-tests.mjs';
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'catalog-runtime-results.json'), 'utf8'));
          assertRequiredVitestTests(result, {
            'server/src/__tests__/teams-catalog-install-no-overrides.test.ts': [
              'previews the native Codex default and installs the same runtime',
              'surfaces an unavailable default in preview before installation writes agents',
              'honors an explicit caller adapter override for a single slug while defaulting the rest to native Claude',
            ],
          });
          JS
          pnpm exec vitest run ui/src/pages/TeamCatalog.test.tsx
      - name: Typecheck server and build affected packages
        run: |
          node scripts/link-plugin-dev-sdk.mjs
          pnpm --filter @groktopus/server typecheck
          pnpm --filter @groktopus/hermes-proprio-adapter build
          node scripts/run-tsc.mjs -p server/tsconfig.build.json
