name: Browser tracing self-hosted acceptance

on:
  pull_request:
    types: [labeled, synchronize]
    paths:
      - ".github/workflows/browser-tracing-self-hosted.yml"
      - "doc/browser-performance-tracing.md"
      - "server/src/browser-tracing-config.ts"
      - "server/src/routes/auth.ts"
      - "ui/src/lib/browser-tracing/**"
      - "ui/src/components/PageLoadTracker.tsx"
      - "tests/perf/browser-tracing/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit or tag to qualify
        required: true
        type: string
      modes:
        description: Comma-separated modes (enabled,disabled,unsampled,sink-failure)
        default: enabled,disabled,unsampled,sink-failure
        required: true
        type: string
      harness_ref:
        description: Commit containing the acceptance harness (defaults to the workflow revision)
        required: false
        type: string
      ui_ref:
        description: Optional exact commit or tag whose production UI is overlaid onto the server ref
        required: false
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'browser-tracing-acceptance') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [enabled, disabled, unsampled, sink-failure]
    steps:
      - name: Select requested mode
        if: ${{ !contains(format(',{0},', inputs.modes || 'enabled,disabled,unsampled,sink-failure'), format(',{0},', matrix.mode)) }}
        run: echo "Skipping ${{ matrix.mode }}"
      - name: Check out exact build
        if: ${{ contains(format(',{0},', inputs.modes || 'enabled,disabled,unsampled,sink-failure'), format(',{0},', matrix.mode)) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        if: ${{ contains(format(',{0},', inputs.modes || 'enabled,disabled,unsampled,sink-failure'), format(',{0},', matrix.mode)) }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Overlay the acceptance harness from the workflow revision
        if: ${{ contains(format(',{0},', inputs.modes || 'enabled,disabled,unsampled,sink-failure'), format(',{0},', matrix.mode)) }}
        env:
          HARNESS_REF: ${{ inputs.harness_ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --depth=1 origin "$HARNESS_REF"
          git archive "$HARNESS_REF" tests/perf/browser-tracing | tar -x
      - name: Overlay the requested production UI ref
        if: ${{ contains(format(',{0},', inputs.modes || 'enabled,disabled,unsampled,sink-failure'), format(',{0},', matrix.mode)) && inputs.ui_ref != '' }}
        env:
          UI_REF: ${{ inputs.ui_ref }}
        run: |
          git fetch --depth=1 origin "$UI_REF"
          rm -rf ui
          git archive FETCH_HEAD ui | tar -x
      - name: Resolve exact server and UI build identities
        if: ${{ contains(format(',{0},', inputs.modes || 'enabled,disabled,unsampled,sink-failure'), format(',{0},', matrix.mode)) }}
        env:
          UI_REF: ${{ inputs.ui_ref || '' }}
        run: |
          server_sha="$(git rev-parse HEAD)"
          if [[ -n "$UI_REF" ]]; then
            ui_sha="$(git rev-parse FETCH_HEAD^{commit})"
          else
            ui_sha="$server_sha"
          fi
          [[ "$server_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ui_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "SERVER_SHA=$server_sha" >> "$GITHUB_ENV"
          echo "UI_SHA=$ui_sha" >> "$GITHUB_ENV"
      - name: Install locked dependencies and Chromium
        if: ${{ contains(format(',{0},', inputs.modes || 'enabled,disabled,unsampled,sink-failure'), format(',{0},', matrix.mode)) }}
        run: |
          npm install --global --ignore-scripts pnpm@9.15.4
          pnpm install --frozen-lockfile --ignore-scripts
          postgres_package=(node_modules/.pnpm/@embedded-postgres+linux-x64@*/node_modules/@embedded-postgres/linux-x64)
          test "${#postgres_package[@]}" = "1"
          (cd "${postgres_package[0]}" && node scripts/hydrate-symlinks.js)
          pnpm --filter @groktopus/plugin-sdk ensure-build-deps
          pnpm exec playwright install --with-deps chromium
      - name: Run exact-build browser tracing acceptance
        if: ${{ contains(format(',{0},', inputs.modes || 'enabled,disabled,unsampled,sink-failure'), format(',{0},', matrix.mode)) }}
        env:
          PROPRIO_BROWSER_TRACING_MODE: ${{ matrix.mode }}
          PROPRIO_BROWSER_TRACING_BUILD_ID: server-${{ env.SERVER_SHA }}__ui-${{ env.UI_SHA }}
        run: >-
          pnpm exec playwright test
          tests/perf/browser-tracing/self-hosted-acceptance.spec.ts
          --config tests/perf/browser-tracing/playwright.config.ts
      - name: Upload acceptance artifacts
        if: ${{ always() && contains(format(',{0},', inputs.modes || 'enabled,disabled,unsampled,sink-failure'), format(',{0},', matrix.mode)) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-tracing-server-${{ env.SERVER_SHA }}-ui-${{ env.UI_SHA }}-${{ matrix.mode }}
          path: test-results/browser-tracing
          if-no-files-found: warn
