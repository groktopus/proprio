name: Droid Auto Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  droid-review:
    if: >-
      github.repository == 'groktopus/proprio' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure Nous Portal model
        shell: bash
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
        run: |
          if [ -z "$NOUS_API_KEY" ]; then
            echo 'NOUS_API_KEY is unavailable to this run' >&2
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.factory"
          cat > "$HOME/.factory/settings.json" <<'FACTORY_JSON'
          {
            "customModels": [{
              "model": "openai/gpt-6.2-sol",
              "displayName": "GPT-6.2 Sol (Nous Portal)",
              "baseUrl": "https://inference-api.nousresearch.com/v1",
              "apiKey": "${NOUS_API_KEY}",
              "provider": "generic-chat-completion-api",
              "maxOutputTokens": 16384
            }]
          }
          FACTORY_JSON
      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@260eac443df653198ed70e9ea9d32980cfabde23 # v13
        with:
          github_token: ${{ github.token }}
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          review_model: custom:GPT-6.2-Sol-(Nous-Portal)-0
          security_model: custom:GPT-6.2-Sol-(Nous-Portal)-0
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
