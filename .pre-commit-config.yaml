repos:
  - repo: local
    hooks:
      - id: agents-guide-links
        name: Validate AGENTS.md guidance links
        entry: pnpm check:agents
        language: system
        pass_filenames: false
        always_run: true
      - id: adapter-runtime-git-push
        name: Check adapter and runtime git push boundaries
        entry: pnpm check:no-git-push
        language: system
        pass_filenames: false
        always_run: true
