# Quickstart with embedded PostgreSQL. See doc/DOCKER.md for setup.
services:
  proprio:
    build:
      context: ..
      dockerfile: Dockerfile
      target: production
    # Ceiling on processes. The image makes tini PID 1 so orphaned agent
    # descendants are reaped instead of piling up as zombies; this is the
    # backstop if something leaks anyway — the container hits its own limit and
    # dies visibly rather than starving the host of pids.
    pids_limit: 2048
    # Includes the shared 30s adapter-settlement window and final cleanup.
    stop_grace_period: 90s
    healthcheck:
      # A 200 response can still report "starting" while recovery runs.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(async response => { if (!response.ok || (await response.json()).status !== 'ok') process.exitCode = 1; }).catch(() => { process.exitCode = 1; })"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 30s
    ports:
      - "${PROPRIO_BIND_IP:-127.0.0.1}:${PROPRIO_PORT:-3100}:3100"
    environment:
      HOST: "0.0.0.0"
      PROPRIO_HOME: "/proprio"

      # ── LLM provider keys (at least one is needed for agents to work) ──
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

      # ── Deployment settings ──
      # "authenticated" requires login, "local_trusted" skips auth
      PROPRIO_DEPLOYMENT_MODE: "authenticated"
      # "private" = LAN only, "public" = internet-facing (use with TLS)
      PROPRIO_DEPLOYMENT_EXPOSURE: "private"
      # Base URL users will access the UI at
      PROPRIO_PUBLIC_URL: "${PROPRIO_PUBLIC_URL:-http://localhost:${PROPRIO_PORT:-3100}}"
      # Extra hostnames the instance accepts beyond the public URL host
      # (LAN or Tailscale aliases), comma-separated; empty means none
      PROPRIO_ALLOWED_HOSTNAMES: "${PROPRIO_ALLOWED_HOSTNAMES:-}"

      # ── Required secret for session signing (generate with: openssl rand -hex 32) ──
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
      # Independent secret for signed approval-gated tool actions.
      PROPRIO_TOOL_ACTION_SIGNING_SECRET: "${PROPRIO_TOOL_ACTION_SIGNING_SECRET:-}"
    volumes:
      # Persistent data directory (database, agent workspaces, uploads)
      - "${PROPRIO_DATA_DIR:-../data/docker-proprio}:/proprio"
