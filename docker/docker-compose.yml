services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: proprio
      POSTGRES_PASSWORD: "${PROPRIO_POSTGRES_PASSWORD:?Set PROPRIO_POSTGRES_PASSWORD in docker/.env}"
      POSTGRES_DB: proprio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proprio -d proprio"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
      target: production
    # No `init: true` here on purpose. The image makes tini PID 1 itself
    # (Dockerfile ENTRYPOINT), which covers every launch path -- compose, plain
    # `docker run`, the quadlet units and the ECS task definition -- instead of
    # one lever per orchestrator. Setting it here too would nest docker-init
    # around tini and make tini warn that it is not PID 1 on every boot.
    # pids_limit is the backstop: if something ever does leak processes again,
    # this container hits its own ceiling and dies visibly rather than starving
    # the whole host of pids.
    pids_limit: 2048
    # Includes the shared 30s adapter-settlement window and final cleanup.
    stop_grace_period: 90s
    healthcheck:
      # A 200 response can still report "starting" while recovery runs.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(async response => { if (!response.ok || (await response.json()).status !== 'ok') process.exitCode = 1; }).catch(() => { process.exitCode = 1; })"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 30s
    ports:
      - "${PROPRIO_BIND_IP:-127.0.0.1}:${PROPRIO_PORT:-3100}:3100"
    environment:
      DATABASE_URL: "postgres://proprio:${PROPRIO_POSTGRES_PASSWORD:?Set PROPRIO_POSTGRES_PASSWORD in docker/.env}@db:5432/proprio"
      PORT: "3100"
      SERVE_UI: "true"
      PROPRIO_DEPLOYMENT_MODE: "authenticated"
      PROPRIO_DEPLOYMENT_EXPOSURE: "private"
      PROPRIO_PUBLIC_URL: "${PROPRIO_PUBLIC_URL:-http://localhost:${PROPRIO_PORT:-3100}}"
      PROPRIO_ALLOWED_HOSTNAMES: "${PROPRIO_ALLOWED_HOSTNAMES:-}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
      # Independent secret for signed approval-gated tool actions.
      PROPRIO_TOOL_ACTION_SIGNING_SECRET: "${PROPRIO_TOOL_ACTION_SIGNING_SECRET:-}"
    volumes:
      - proprio-data:/proprio
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  proprio-data:
