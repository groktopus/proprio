services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: proprio
      POSTGRES_PASSWORD: "${PROPRIO_POSTGRES_PASSWORD:?Set PROPRIO_POSTGRES_PASSWORD in docker/.env}"
      POSTGRES_DB: proprio
    healthcheck:
      # The first-volume initialization server accepts Unix sockets only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    extends:
      file: docker-compose.app.yml
      service: self-hosted-app
    environment:
      DATABASE_URL: "postgres://proprio:${PROPRIO_POSTGRES_PASSWORD:?Set PROPRIO_POSTGRES_PASSWORD in docker/.env}@db:5432/proprio"
    volumes:
      - proprio-data:/proprio
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  proprio-data:
